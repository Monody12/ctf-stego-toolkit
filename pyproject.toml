[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-stego-toolkit"
version = "1.0.0"
description = "Python toolkit for automated CTF image steganography analysis."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Monody12"}
]
keywords = ["ctf", "steganography", "misc", "image", "forensics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.optional-dependencies]
image = [
  "Pillow>=9.0.0",
  "numpy>=1.20.0",
]

[project.scripts]
ctf-stego-solve = "stego_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Monody12/ctf-stego-toolkit"
Issues = "https://github.com/Monody12/ctf-stego-toolkit/issues"

[tool.setuptools]
package-dir = {"" = "ctf_stego_toolkit"}
py-modules = ["solve"]

[tool.setuptools.packages.find]
where = ["ctf_stego_toolkit"]
include = ["stego_toolkit*"]
